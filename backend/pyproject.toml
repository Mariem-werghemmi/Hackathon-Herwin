[project]
name = "hermind-api"
version = "0.1.0"
description = "Private chat API for the HERmind mobile prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "aiosqlite>=0.20,<1",
  "pydantic-settings>=2.0,<3",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
