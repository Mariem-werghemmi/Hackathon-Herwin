services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hermind
      POSTGRES_USER: hermind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - hermind-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermind -d hermind"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hermind-postgres:
